name: Auto-merge WordPress patch updates

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for required checks
        if: >-
          contains(steps.metadata.outputs.dependency-names, 'wordpress') &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr checks "$PR_URL" --required --watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Merge verified WordPress patch
        if: >-
          contains(steps.metadata.outputs.dependency-names, 'wordpress') &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Build the merged image
        if: >-
          contains(steps.metadata.outputs.dependency-names, 'wordpress') &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
